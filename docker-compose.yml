# Full stack: React SPA (nginx) + ASP.NET API + Postgres
#
#   docker compose up --build
#
# Frontend → http://localhost:3000  (proxies /api → api:8080)
# API      → http://localhost:8080  (direct, optional)
# Postgres → localhost:5432

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: myipl
      POSTGRES_PASSWORD: myipl
      POSTGRES_DB: myipl
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myipl -d myipl"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./backend/MyIPL.Api
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      ASPNETCORE_ENVIRONMENT: Production
      DATABASE_URL: postgresql://myipl:myipl@db:5432/myipl
      # Browser origins that may call the API directly (Vite dev + compose web)
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Same-origin: nginx forwards /api to the api service
        VITE_API_URL: ""
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
